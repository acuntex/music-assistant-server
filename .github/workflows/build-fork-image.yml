name: build fork test image

# Fork-only: builds an overlay test image on top of the official image for a
# branch under test. Not part of any pull request.
on:
  workflow_dispatch:
  push:
    branches:
      # one branch per feature branch under test, all cut from ci-base
      - "ci/**"

permissions:
  contents: read
  packages: write

env:
  FRONTEND_REPOSITORY: acuntex/music-assistant-frontend
  FRONTEND_REF: feat/streams-program-bus
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.8.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the server branch
        uses: actions/checkout@v4

      # The image carries a built frontend, so it is built here rather than pulled
      # from a release. It lives next to this checkout instead of inside it, so the
      # build context stays this repository.
      - name: Check out the frontend branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/music-assistant-server:ai-radio-program-bus
            ghcr.io/${{ github.repository_owner }}/music-assistant-server:${{ github.sha }}
